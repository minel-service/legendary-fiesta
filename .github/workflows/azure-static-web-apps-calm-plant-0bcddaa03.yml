name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: "SKUDDSIKKER SJEKK: Sites.Selected MÅ IKKE vaere i login-scopes"
        run: |
          echo "Sjekker at Sites.Selected ikke er lagt inn i _scopes (login-scope)..."
          if grep -E "_scopes\s*=\s*\[.*Sites\.Selected" src/index.html; then
            echo ""
            echo "=========================================================="
            echo "❌  DEPLOYMENT STOPPET — KRITISK KONFIGURASJONSFEIL"
            echo "=========================================================="
            echo "Sites.Selected er funnet i _scopes i src/index.html."
            echo ""
            echo "Dette blokkerer innlogging for ALLE 50 ansatte og krever"
            echo "IT-admin-godkjenning fra Microsoft Azure AD."
            echo ""
            echo "LØSNING: Fjern Sites.Selected fra _scopes. Bruk spFetch()"
            echo "for direkte SharePoint Graph-kall i stedet."
            echo "=========================================================="
            exit 1
          fi
          echo "✅  OK: Sites.Selected er ikke i login-scopes. Deployment fortsetter."

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_PLANT_0BCDDAA03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./src"
          api_location: "api"
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_PLANT_0BCDDAA03 }}
          action: "close"
